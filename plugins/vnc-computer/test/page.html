<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vnc-computer test page</title>
<style>
  html, body { margin: 0; height: 100%; background: rgb(200, 40, 40); font: 24px sans-serif; color: #fff; }
  body.clicked { background: rgb(30, 160, 70); }
  /* Large target so the click lands regardless of browser chrome height. */
  #toggle { position: fixed; left: 40px; top: 60px; width: 560px; height: 420px;
            font-size: 32px; background: rgb(240, 240, 240); color: #000; border: 4px solid #000; }
</style>
</head>
<body>
  <button id="toggle" onclick="document.body.classList.toggle('clicked')">toggle background</button>
</body>
</html>
